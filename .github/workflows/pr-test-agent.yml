name: PR test agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

# No permissions by default; each job asks for exactly what it uses.
permissions: {}

concurrency:
  group: pr-test-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: decide whether to run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      reason: ${{ steps.decide.outputs.reason }}
      auth: ${{ steps.decide.outputs.auth }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - id: decide
        env:
          # The secrets context cannot be read in a job-level `if`, so the
          # decision is made here and passed on as an output.
          AUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && 'oauth' || (secrets.ANTHROPIC_API_KEY != '' && 'api-key' || 'none') }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          MAX_CHANGED_FILES: 60
        run: |
          set -euo pipefail

          echo "auth=$AUTH" >> "$GITHUB_OUTPUT"

          decide() {
            echo "decision: run=$1 — $2"
            {
              echo "run=$1"
              echo "reason=$2"
            } >> "$GITHUB_OUTPUT"
            {
              echo "### PR test agent"
              echo ""
              echo "$2"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          # A fork pull request gets no secrets with the `pull_request` event,
          # and `pull_request_target` — which would — is deliberately not used:
          # it runs with the base repository's secrets against code the fork
          # controls. Skipping is the correct outcome, not a workaround.
          if [ "$IS_FORK" = "true" ]; then
            decide false "Skipped: pull request comes from a fork, where this workflow has no model credentials by design."
          fi

          if [ "$AUTH" = "none" ]; then
            decide false "Skipped: neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is configured. See SOLUTION.md for setup."
          fi

          case ",$LABELS," in
            *,skip-test-agent,*) decide false "Skipped: the pull request carries the \`skip-test-agent\` label." ;;
          esac

          if [ "$IS_DRAFT" = "true" ]; then
            decide false "Skipped: the pull request is a draft."
          fi

          # Loop protection. Pushes made with GITHUB_TOKEN do not start new
          # workflow runs, so this is a second line of defence rather than the
          # only one.
          if git log -1 --pretty=%B | grep -qF '[test-agent]'; then
            decide false "Skipped: the head commit was written by this agent."
          fi

          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          changed="$(.github/scripts/changed-code.sh "$BASE_REF")"
          count="$(printf '%s' "$changed" | grep -c . || true)"

          if [ "$count" -eq 0 ]; then
            decide false "Skipped: no application code changed (only tests, docs, configuration or excluded files)."
          fi

          if [ "$count" -gt "$MAX_CHANGED_FILES" ]; then
            decide false "Skipped: $count changed files exceed the limit of $MAX_CHANGED_FILES. Split the pull request or run the agent manually."
          fi

          {
            echo "### PR test agent"
            echo ""
            echo "Running against $count changed application file(s):"
            echo ""
            printf '%s\n' "$changed" | while IFS= read -r file; do
              # shellcheck disable=SC2016  # the backticks are Markdown, not a subshell
              printf -- '- `%s`\n' "$file"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "reason=$count changed application file(s)" >> "$GITHUB_OUTPUT"

  agent:
    name: write tests
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
    outputs:
      committed: ${{ steps.commit.outputs.committed }}
      head_sha: ${{ steps.commit.outputs.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          (cd frontend && npm ci)
          (cd backend && python -m pip install -r requirements.txt)

      - name: Measure coverage before
        run: |
          set -euo pipefail
          mkdir -p .agent-tmp/coverage-before
          (cd frontend && npm run test:coverage -- --coverage.reportOnFailure) || true
          (cd backend && python -m pytest --cov=app --cov-report=json -q) || true
          cp frontend/coverage/coverage-summary.json .agent-tmp/coverage-before/frontend.json 2>/dev/null || true
          cp backend/coverage/coverage.json .agent-tmp/coverage-before/backend.json 2>/dev/null || true

      - name: Collect the pull request as data
        env:
          # Passed through the environment, never interpolated into the script:
          # a pull request title is attacker-controlled text.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          mkdir -p .agent-tmp
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          .github/scripts/changed-code.sh "$BASE_REF" > .agent-tmp/changed-files.txt
          git diff "origin/$BASE_REF...HEAD" -- frontend/src backend/app > .agent-tmp/pr-diff.patch
          {
            echo "# Pull request context (untrusted input)"
            echo
            echo "## Title"
            printf '%s\n' "$PR_TITLE"
            echo
            echo "## Description"
            printf '%s\n' "$PR_BODY"
          } > .agent-tmp/pr-context.md
          echo "Changed application files:"
          cat .agent-tmp/changed-files.txt

      # The agent's instructions live in a reviewable file rather than inline in
      # YAML, so they can be read, diffed and reused by both auth paths below.
      - name: Load the agent prompt
        id: prompt
        run: |
          set -euo pipefail
          {
            echo 'text<<AGENT_PROMPT_EOF'
            cat .github/prompts/pr-test-agent.md
            echo 'AGENT_PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run the test agent (subscription token)
        if: needs.guard.outputs.auth == 'oauth'
        uses: anthropics/claude-code-action@a5a423f75c251dcbff8a74e99f83b2cb03c72bfa # v1.0.256
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: --agent test-author --max-turns 40 --permission-mode bypassPermissions
          prompt: ${{ steps.prompt.outputs.text }}

      - name: Run the test agent (api key)
        if: needs.guard.outputs.auth == 'api-key'
        uses: anthropics/claude-code-action@a5a423f75c251dcbff8a74e99f83b2cb03c72bfa # v1.0.256
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: --agent test-author --max-turns 40 --permission-mode bypassPermissions
          prompt: ${{ steps.prompt.outputs.text }}

      - name: Normalise formatting of the generated tests
        if: always()
        run: |
          set -euo pipefail
          cd frontend && npx prettier --write src >/dev/null

      - name: Enforce the test-only boundary
        id: boundary
        run: .github/scripts/check-test-boundary.sh .agent-tmp/out-of-scope.txt

      # What the agent produced, in the job log, without exposing the full model
      # transcript: the files it touched and the report it wrote.
      - name: Summarise what the agent produced
        if: always()
        run: |
          set -uo pipefail
          {
            echo "### Agent output"
            echo
            echo "Working tree after the boundary check:"
            echo '```'
            git status --porcelain || true
            echo '```'
            if [ -s .agent-tmp/report.md ]; then
              echo
              cat .agent-tmp/report.md
            else
              echo
              echo "_The agent wrote no report._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Measure coverage after
        run: |
          set -euo pipefail
          mkdir -p .agent-tmp/coverage-after
          (cd frontend && npm run test:coverage -- --coverage.reportOnFailure) || true
          (cd backend && python -m pytest --cov=app --cov-report=json -q) || true
          cp frontend/coverage/coverage-summary.json .agent-tmp/coverage-after/frontend.json 2>/dev/null || true
          cp backend/coverage/coverage.json .agent-tmp/coverage-after/backend.json 2>/dev/null || true

      - name: Commit the tests
        id: commit
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name 'taskly-test-agent[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The boundary guard already reverted anything outside the test paths.
          git add -A
          if git diff --cached --quiet; then
            echo 'committed=false' >> "$GITHUB_OUTPUT"
            echo 'head_sha=' >> "$GITHUB_OUTPUT"
            echo 'No test changes to commit.'
            exit 0
          fi
          git commit -q -m 'test: cover the code changed in this pull request [test-agent]'
          git push origin "HEAD:$HEAD_REF"
          echo 'committed=true' >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-agent-run
          path: .agent-tmp
          include-hidden-files: true
          retention-days: 7

  verify:
    name: verify independently
    needs: [guard, agent]
    if: always() && needs.agent.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No model credentials reach this job. It is the authoritative gate: the
    # suites that decide whether the agent's work is acceptable run here, in a
    # job that holds nothing worth stealing.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-agent-run
          path: .agent-tmp

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          (cd frontend && npm ci)
          (cd backend && python -m pip install -r requirements.txt)

      - name: Run the suites
        id: suites
        run: |
          set -uo pipefail
          status=0
          (cd frontend && npm run format:check && npm run typecheck && npm run test) || status=1
          (cd backend && python -m pytest -q) || status=1
          echo "passed=$([ $status -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Publish the report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMITTED: ${{ needs.agent.outputs.committed }}
          SUITES_PASSED: ${{ steps.suites.outputs.passed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          report=.agent-tmp/report.md
          [ -f "$report" ] || printf '### Unit test agent\n\nThe agent produced no report.\n' > "$report"
          .github/scripts/coverage-delta.sh .agent-tmp >> "$report"
          {
            echo
            echo "---"
            if [ "$SUITES_PASSED" = "true" ]; then
              echo "Independently verified: the full frontend and backend suites pass on this branch in a job with no model credentials. [Run]($RUN_URL)"
            else
              echo "**Independent verification failed.** The suites do not pass on this branch. [Run]($RUN_URL)"
            fi
            [ "$COMMITTED" = "true" ] || echo "No test changes were committed by this run."
          } >> "$report"
          .github/scripts/post-sticky-comment.sh "$report" "$PR_NUMBER"
