name: Backfill tests

# The same agent and the same skills as the pull request workflow, pointed at
# code that was already missing tests before any of this existed. Run it by hand
# from the Actions tab; it opens a pull request rather than pushing to main.
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Which side to work on
        type: choice
        default: both
        options: [both, frontend, backend]
      max_files:
        description: How many source files to cover in one run
        default: '6'

permissions: {}

concurrency:
  group: backfill-tests
  cancel-in-progress: false

jobs:
  backfill:
    name: write missing tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Select credentials
        id: auth
        env:
          AUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' && 'oauth' || (secrets.ANTHROPIC_API_KEY != '' && 'api-key' || 'none') }}
        run: |
          set -euo pipefail
          echo "mode=$AUTH" >> "$GITHUB_OUTPUT"
          if [ "$AUTH" = "none" ]; then
            echo "No model credentials are configured, so the agent will not run. See SOLUTION.md." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          set -euo pipefail
          (cd frontend && npm ci)
          (cd backend && python -m pip install -r requirements.txt)

      - name: Measure coverage before
        run: |
          set -euo pipefail
          mkdir -p .agent-tmp/coverage-before
          (cd frontend && npm run test:coverage -- --coverage.reportOnFailure) || true
          (cd backend && python -m pytest --cov=app --cov-report=json -q) || true
          cp frontend/coverage/coverage-summary.json .agent-tmp/coverage-before/frontend.json 2>/dev/null || true
          cp backend/coverage/coverage.json .agent-tmp/coverage-before/backend.json 2>/dev/null || true

      - name: Load the agent prompt
        id: prompt
        env:
          SCOPE: ${{ inputs.scope }}
          MAX_FILES: ${{ inputs.max_files }}
        run: |
          set -euo pipefail
          {
            echo 'text<<AGENT_PROMPT_EOF'
            sed -e "s|{{SCOPE}}|$SCOPE|g" -e "s|{{MAX_FILES}}|$MAX_FILES|g" \
              .github/prompts/backfill-tests.md
            echo 'AGENT_PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run the test agent (subscription token)
        if: steps.auth.outputs.mode == 'oauth'
        uses: anthropics/claude-code-action@a5a423f75c251dcbff8a74e99f83b2cb03c72bfa # v1.0.256
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: --agent test-author --max-turns 60 --permission-mode bypassPermissions
          prompt: ${{ steps.prompt.outputs.text }}

      - name: Run the test agent (api key)
        if: steps.auth.outputs.mode == 'api-key'
        uses: anthropics/claude-code-action@a5a423f75c251dcbff8a74e99f83b2cb03c72bfa # v1.0.256
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: --agent test-author --max-turns 60 --permission-mode bypassPermissions
          prompt: ${{ steps.prompt.outputs.text }}

      - name: Normalise formatting of the generated tests
        if: always()
        run: |
          set -euo pipefail
          cd frontend && npx prettier --write src >/dev/null

      - name: Enforce the test-only boundary
        run: .github/scripts/check-test-boundary.sh .agent-tmp/out-of-scope.txt

      - name: Measure coverage after
        run: |
          set -euo pipefail
          mkdir -p .agent-tmp/coverage-after
          (cd frontend && npm run test:coverage -- --coverage.reportOnFailure) || true
          (cd backend && python -m pytest --cov=app --cov-report=json -q) || true
          cp frontend/coverage/coverage-summary.json .agent-tmp/coverage-after/frontend.json 2>/dev/null || true
          cp backend/coverage/coverage.json .agent-tmp/coverage-after/backend.json 2>/dev/null || true

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'taskly-test-agent[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The boundary guard already reverted anything outside the test paths.
          git add -A
          if git diff --cached --quiet; then
            echo 'The agent produced no test changes.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="test-agent/backfill-${GITHUB_RUN_ID}"
          git checkout -q -b "$branch"
          git commit -q -m 'test: backfill unit tests for untested modules [test-agent]'
          git push -q origin "$branch"
          body=.agent-tmp/pr-body.md
          {
            cat .agent-tmp/report.md 2>/dev/null || echo '### Unit test agent'
            .github/scripts/coverage-delta.sh .agent-tmp
            echo
            echo "---"
            echo "Opened by the \`backfill-tests\` workflow. CI verifies these tests independently, in jobs that hold no model credentials."
          } > "$body"
          # Repositories with "Allow GitHub Actions to create and approve pull
          # requests" disabled reject this. The work is already pushed, so say
          # where it is instead of failing the run.
          if ! gh pr create --base main --head "$branch" \
            --title 'test: backfill unit tests for untested modules' \
            --body-file "$body"; then
            {
              echo "### Backfill"
              echo
              echo "Tests were written and pushed to \`$branch\`, but this repository does not allow GitHub Actions to open pull requests. Open one from that branch, or enable the setting in Settings → Actions → General."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backfill-run
          path: .agent-tmp
          include-hidden-files: true
          retention-days: 7
